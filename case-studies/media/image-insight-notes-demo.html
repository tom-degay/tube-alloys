<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Insight — try image notes</title>
  <link rel="preload" as="image" href="/case-studies/media/image-insight-grid/session-photo-218.webp?v=2">
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#e5ecee; }
    body::before { content:''; position:fixed; inset:-24px; background:linear-gradient(#eef2f3a8,#eef2f3a8),url('image-insight-hero-ui.jpg') center/cover; filter:blur(12px); }
    iframe { position:absolute; inset:0; border:0; transform-origin:top left; opacity:0; visibility:hidden; transition:opacity 350ms ease; }
    body.ready iframe { opacity:1; visibility:visible; }
    .loading { position:fixed; z-index:1; inset:76px 0 28px; display:grid; place-items:center; pointer-events:none; transition:opacity 350ms ease,visibility 0s linear 350ms; }
    .skeleton-photo { position:relative; overflow:hidden; isolation:isolate; width:min(52vw,calc(100vh - 104px)); aspect-ratio:1; border-radius:16%; background:rgb(255 255 255 / 58%); box-shadow:0 5px 12px rgb(0 0 0 / 6%); }
    .skeleton-photo::after { content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 15%,rgb(255 255 255 / 20%) 32%,rgb(255 255 255 / 85%) 50%,rgb(255 255 255 / 20%) 68%,transparent 85%); transform:translateX(-110%); animation:shimmer 2.4s ease-in-out infinite; }
    .ready .loading,.failed .loading { opacity:0; visibility:hidden; }
    .ready .skeleton-photo::after,.failed .skeleton-photo::after { animation-play-state:paused; }
    .loading-label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    @keyframes shimmer { 0% { transform:translateX(-110%); } 85%,100% { transform:translateX(110%); } }
    @media(max-width:430px),(pointer:coarse) { .loading { inset:0; } .skeleton-photo { width:min(calc(100vw - 48px),360px,45vh); } }
    .try { position:fixed; z-index:2; right:20px; top:20px; border:1px solid #ffffffb0; border-radius:999px; background:#ffffffe8; color:#187d94; padding:7px 15px; font:600 14px/1.5 system-ui,sans-serif; cursor:pointer; }
    .try:focus-visible { outline:2px solid #187d94; outline-offset:3px; }
    .try:disabled { cursor:wait; }
    .fallback { position:fixed; inset:auto 24px 24px; text-align:center; font:14px/1.5 system-ui,sans-serif; color:#334857; }
    .fallback a { color:inherit; }
    @media(prefers-reduced-motion:reduce) { iframe,.loading { transition:none; } .skeleton-photo::after { display:none; animation:none; } }
  </style>
</head>
<body>
  <div class="loading" role="status"><div class="skeleton-photo" aria-hidden="true"></div><span class="loading-label">Loading interactive photo…</span></div>
  <iframe title="Image Insight prototype — explore a photograph and add notes" src="/prototypes/image-insight/?theme=light&amp;embed=notes" inert aria-busy="true"></iframe>
  <button class="try" type="button" disabled>Try it</button>
  <p class="fallback" hidden>Open the <a href="/prototypes/image-insight/" target="_blank" rel="noopener">Image Insight prototype</a> to try adding notes.</p>
  <script>
    // This wrapper stages the actual app. All note UI, state and gestures belong
    // to the prototype; there is no second implementation of the editor here.
    const frame = document.querySelector('iframe');
    const trigger = document.querySelector('.try');
    let prototypeRoot;
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function waitFor(check) {
      for (let i = 0; i < 300; i++) { const result = check(); if (result) return result; await pause(75); }
      throw new Error('The prototype did not finish preparing.');
    }
    function fit() {
      const width = document.documentElement.clientWidth;
      const mobile = matchMedia('(pointer:coarse)').matches || width <= 430;
      const viewport = mobile ? width : Math.max(960, width);
      const scale = width / viewport;
      frame.style.width = `${viewport}px`;
      frame.style.height = `${document.documentElement.clientHeight / scale}px`;
      frame.style.transform = `scale(${scale})`;
      // Reserve physical space for the chip, even when the app is scaled down.
      prototypeRoot?.style.setProperty('--demo-header', `${76 / scale}px`);
      prototypeRoot?.style.setProperty('--demo-footer', `${28 / scale}px`);
    }
    new ResizeObserver(fit).observe(document.documentElement);
    fit();
    frame.addEventListener('load', async () => {
      try {
        const doc = frame.contentDocument;
        prototypeRoot = doc.documentElement;
        fit();
        const backdrop = doc.createElement('style');
        backdrop.textContent = `html,body{background:#e5ecee!important}body::before{content:"";position:fixed;inset:-24px;background:url("/case-studies/media/image-insight-hero-ui.jpg") center/cover;filter:blur(12px)}.workspace{visibility:hidden}
          html body #discussion-dialog #image-notes,
          html body #discussion-dialog #image-notes:is(:hover,:focus,:focus-visible){border-color:transparent;outline:none;box-shadow:none}
          @media(min-width:901px),(min-width:601px) and (min-height:501px){
            #discussion-dialog{top:var(--demo-header);bottom:auto;margin:0 auto;height:calc(100dvh - var(--demo-header) - var(--demo-footer));max-height:none}
          }`;
        doc.head.append(backdrop);
        // The app now boots straight into its real focus view. Reveal as soon as
        // this one photo is decoded, without waiting for grid/entrance animations.
        const dialog = await waitFor(() => doc.querySelector('#discussion-dialog')?.open && doc.querySelector('#discussion-dialog'));
        await doc.querySelector('#discussion-image').decode();
        await new Promise(resolve => requestAnimationFrame(resolve));
        document.body.classList.add('ready');
        document.querySelector('.loading').setAttribute('aria-hidden', 'true');
        frame.inert = false;
        frame.setAttribute('aria-busy', 'false');
        trigger.disabled = false;
        trigger.addEventListener('click', async () => {
          if (!dialog.open) {
            doc.querySelector('#discuss-images').click();
            await waitFor(() => dialog.open);
          }
          if (doc.querySelector('#toggle-notes').getAttribute('aria-expanded') !== 'true') doc.querySelector('#toggle-notes').click();
        });
      } catch (error) {
        document.body.classList.add('failed');
        document.querySelector('.loading').setAttribute('aria-hidden', 'true');
        document.querySelector('.fallback').hidden = false;
        trigger.hidden = true;
        console.error(error);
      }
    });
  </script>
</body>
</html>
