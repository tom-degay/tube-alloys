<script><![CDATA[
(function () {
  var timers = new WeakMap();
  function activate(icon, hover) {
    if (icon.classList.contains('sliders')) icon.classList.add('is-reset');
    if (icon.classList.contains('arrows')) {
      icon.setAttribute('aria-pressed', icon.getAttribute('aria-pressed') !== 'true');
    }
    clearTimeout(timers.get(icon));
    icon.classList.remove('is-playing', 'is-hover-playing');
    void icon.getBoundingClientRect();
    icon.classList.remove('is-reset');
    icon.classList.add(hover ? 'is-hover-playing' : 'is-playing');
    timers.set(icon, setTimeout(function () { icon.classList.remove('is-playing', 'is-hover-playing'); }, 720));
  }
  document.querySelectorAll('.icon').forEach(function (icon) {
    icon.addEventListener('pointerenter', function (event) {
      if (event.pointerType !== 'touch') {
        icon.classList.remove('is-reset');
        icon.classList.add('is-hover');
        if (icon.classList.contains('plus')) activate(icon);
      }
    });
    icon.addEventListener('pointerleave', function () { icon.classList.remove('is-hover'); });
    icon.addEventListener('click', function () { activate(icon); });
    icon.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      if (!event.repeat) activate(icon);
    });
  });
}());
]]></script>
</svg>
