const editor=document.querySelector('.editor'),toolbar=document.querySelector('.toolbar'),status=document.querySelector('.status'),buttons=[...toolbar.querySelectorAll('button[data-command]')];

  headingHighlight.style.transition='none';
  headingHighlight.style.transform=`translateX(${active.offsetLeft}px)`;
  void headingHighlight.offsetWidth;
  headingHighlight.style.removeProperty('transition');
 }else headingHighlight.style.transform=`translateX(${active.offsetLeft}px)`;

const more=toolbar.querySelector('.overflow-toggle'),overflow=toolbar.querySelector('.overflow-panel');
const tooltip=document.createElement('div');tooltip.className='toolbar-tooltip';tooltip.id='formatting-tooltip';tooltip.role='tooltip';tooltip.hidden=true;document.body.append(tooltip);

const shortcuts={bold:'B',italic:'I',underline:'U'};
[...buttons,more].forEach(b=>{b.removeAttribute('title');if(shortcuts[b.dataset.command])b.setAttribute('aria-keyshortcuts',(mac?'Meta+':'Control+')+shortcuts[b.dataset.command]);});
function hideTooltip(keepWarm=false){
 clearTimeout(tooltipTimer);
 if(keepWarm===true){if(!tooltip.hidden)tooltipWarmUntil=Date.now()+600;}else tooltipWarmUntil=0;
 tooltipMotion?.cancel();tooltipMotion=null;tooltip.hidden=true;
 if(tooltipButton)tooltipButton.removeAttribute('aria-describedby');tooltipButton=null;
}
function showTooltip(button,delay=0){
 const warm=!tooltip.hidden||Date.now()<tooltipWarmUntil;
 hideTooltip(true);tooltipButton=button;
 tooltipTimer=setTimeout(()=>{
  if(!button.isConnected||!button.getClientRects().length)return;
  tooltip.replaceChildren(document.createTextNode(button.getAttribute('aria-label')+(button.getAttribute('aria-pressed')==='mixed'?' (mixed)':'')));

toolbar.addEventListener('pointerout',e=>{if(e.target.closest('button')&&!e.target.closest('button').contains(e.relatedTarget))hideTooltip(true);});
toolbar.addEventListener('focusin',e=>{if(e.target.matches('button:focus-visible'))showTooltip(e.target);});

 const key=e.key.toLowerCase();
 if(key==='z'||(!mac&&key==='y')){e.preventDefault();travelHistory(e.shiftKey||key==='y');return;}
 const command={b:'bold',i:'italic',u:'underline'}[key];
 if(command){e.preventDefault();run(buttons.find(b=>b.dataset.command===command));}
});

 motion.finished.then(()=>{if(overflowMotion===motion){overflow.hidden=true;motion.cancel();overflowMotion=null;}}).catch(()=>{});
}
function openOverflow(focusFirst=false){

let savedRange=null;

function updatePlaceholder(){editor.dataset.empty=String(!editor.textContent.trim()&&!editor.querySelector('hr,img'));}

const blocks=['p','h1','h2','h3','blockquote'];

function removeQuotes(){

const undoStack=[],redoStack=[];

function commitHistory(before,after,merge=false){
